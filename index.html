function freshState(){return {version:1,settings:{startDate:META.defaultStartDate,endDate:META.defaultEndDate,officialHours:META.currentOfficialHours,theme:'light'},subjects:{},logs:[],subjectNotes:{}}}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function number(n,d=0){return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:0})}
function percent(a,b){return b>0?Math.max(0,Math.min(100,100*a/b)):0}
function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function asDate(iso){if(!iso)return null;const d=new Date(iso+'T12:00:00');return Number.isNaN(d.getTime())?null:d}

function workingDays(from,to){const d=asDate(from), end=asDate(to);if(!d||!end||d>end)return 0;let count=0;while(d<=end){if(d.getDay()!==0&&d.getDay()!==6)count++;d.setDate(d.getDate()+1)}return count}
function truncate(s,n=26){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}

function teacher(s){return override(s.id).teacher??s.teacher??''}
function examKind(s){const value=override(s.id).exam;return value!==undefined?value:/(pr[aá]tica)/i.test(s.exam)?'practical':/(te[oó]rica)/i.test(s.exam)?'theory':/sim/i.test(s.exam)?'both':'unknown'}
function effectiveStatus(s){const o=override(s.id);return o.status || (subjectHours(s.id)>0?'in-progress':'not-started')}

function badge(text,color=''){return `<span class="tag ${color}">${esc(text)}</span>`}
function badgeExam(s){const k=examKind(s);return badge(QUALS.find(x=>x[0]===k)?.[1]||'A confirmar',k==='unknown'?'':k==='none'?'green':k==='practical'?'purple':'blue')}

function isStudy(l){return l.type==='Estudo pessoal'}
function courseLogs(){return state.logs.filter(l=>!isStudy(l))}
function totalHours(){return courseLogs().reduce((a,l)=>a+(+l.hours||0),0)}
function personalHours(){return state.logs.filter(isStudy).reduce((a,l)=>a+(+l.hours||0),0)}
function subjectHours(id){return courseLogs().filter(l=>l.subjectId===id).reduce((a,l)=>a+(+l.hours||0),0)}
function getExamDate(s){return override(s.id).examDate||s.examDate||''}

function chartMax(a){return Math.max(1,...a)}
function pctDisp(a,b){return `${number(percent(a,b),1)}%`}

function calcCourse(){const today=localDate(new Date()),end=state.settings.endDate,start=state.settings.startDate;const days=Math.max(0,dayDiff(today,end)),work=workingDays(today,end),totalDays=Math.max(1,dayDiff(start,end)),elapsed=Math.min(100,Math.max(0,100*dayDiff(start,today)/totalDays));return {today,end,start,days,work,elapsed,finished:dayDiff(today,end)<0}}

const GRADE_CUTOFF=META.scheduleLastImported;
const GRADE_VERSION=1;
function hydrateScheduleImports(){
  if(state.scheduleRevision===GRADE_VERSION)return;
  // Nunca sobrescrever lançamentos manuais ou importar atividades futuras.
  const existingManual=state.logs.filter(l=>!l.gradeImported);
  function manuallyCovered(g){return existingManual.some(l=>l.date===g.date&&l.subjectId===g.subjectId&&(g.subjectId!=='EXTRA'||norm([l.note,l.activityLabel].join(' ')).includes(norm(g.title))))}
  const known=new Set(state.logs.map(l=>l.id));
  for(const g of SRC.schedule){
    if(g.date>GRADE_CUTOFF || !g.hours || known.has(g.id))continue;
    if(manuallyCovered(g))continue;
    state.logs.push({id:g.id,date:g.date,hours:g.hours,subjectId:g.subjectId,
      activityLabel:g.subjectId==='EXTRA'?g.title:'',subId:'',type:g.type,
      note:'Grade Turma 3 · '+g.start+'–'+g.end+' · '+g.title+(g.note?' · '+g.note:'')+' · Pré-lançamento, confirmar realização e presença',
      gradeImported:true,gradeSlot:g.slot});
  }
  state.logs.sort((a,b)=>b.date.localeCompare(a.date));
  state.scheduleRevision=GRADE_VERSION;
}

  try{const rev=await cloudWriteTransaction(serialized,oldRev);cloud.revision=rev;cloud.remote=JSON.parse(serialized);cloud.ready=true;cloud.dirty=false;cloudMarkSynced(serialized);cloudSetPhase('ready');cloudStartListen();toast('Dados enviados ao Firebase com sucesso.');}
  catch(e){if(String(e?.message||'').startsWith('CONFLICT')){cloudSetPhase('reading','Conflito detectado. Consultando a versão atual da nuvem...');await cloudAuthChanged(cloud.user)}else cloudSetPhase('error',cloudErrorText(e))}
 }
}
async function cloudWriteTransaction(payload,expected){if(new Blob([payload]).size>800000)throw Error('O registro ultrapassou o limite seguro de um documento. Exporte o backup e reduza os lançamentos.');return await cloud.sdk.fs.runTransaction(cloud.db,async tx=>{
 const snap=await tx.get(cloud.ref);const latest=snap.exists()?Number(snap.data().revision||0):0;
 if(latest!==expected)throw Error('CONFLICT: a versão na nuvem foi alterada por outro dispositivo.');
 const revision=latest+1;tx.set(cloud.ref,{payload,revision,updatedAt:cloud.sdk.fs.serverTimestamp(),app:'acadepol-ip',writerId:cloud.writerId});return revision;
 });}
function cloudQueueSave(){if(!cloud.ready||cloud.applying||!cloud.user)return;cloud.dirty=true;cloud.localSerial++;clearTimeout(cloud.writeTimer);cloudSetPhase('saving','Alterações locais protegidas. Enviando para a nuvem...');cloud.writeTimer=setTimeout(cloudFlush,850)}
async function cloudFlush(){if(!cloud.ready||!cloud.dirty||cloud.writing||!cloud.user)return;cloud.writing=true;const serial=cloud.localSerial,serialized=JSON.stringify(state),expected=cloud.revision;
 try{const rev=await cloudWriteTransaction(serialized,expected);cloud.revision=rev;cloud.remote=JSON.parse(serialized);cloud.dirty=cloud.localSerial!==serial;cloudMarkSynced(serialized);cloudSetPhase(cloud.dirty?'saving':'ready',cloud.dirty?'Enviando novas alterações...':'');if(cloud.dirty){clearTimeout(cloud.writeTimer);cloud.writeTimer=setTimeout(cloudFlush,250)}}
 catch(e){cloud.ready=false;if(String(e?.message||'').startsWith('CONFLICT')){cloudSetPhase('reading','Conflito detectado. Recarregando a versão atual da nuvem...');await cloudAuthChanged(cloud.user)}else cloudSetPhase('offline',cloudErrorText(e));}
 finally{cloud.writing=false}
}
function cloudStartListen(){if(cloud.unsubscribe)cloud.unsubscribe();cloud.unsubscribe=cloud.sdk.fs.onSnapshot(cloud.ref,{includeMetadataChanges:false},snap=>{
 if(!cloud.ready||!cloud.user||snap.metadata.hasPendingWrites||!snap.exists())return;
 const next=Number(snap.data().revision||0);if(next<=cloud.revision)return;
 if(snap.data().writerId===cloud.writerId && cloud.writing){return}
 try{cloud.remote=cloudParseRemote(snap.data());cloud.revision=next;
  if(cloud.dirty||cloud.writing){cloud.ready=false;cloudSetPhase('conflict','Outra sessão atualizou a nuvem enquanto você tinha alterações pendentes. Escolha a versão a manter.');return}
  cloudAdopt(cloud.remote);
 }catch(e){cloudSetPhase('error',cloudErrorText(e))}
 },e=>cloudSetPhase('offline',cloudErrorText(e)))}
async function cloudRetry(){if(!cloud.user){cloudSetPhase('signedout');return}if(cloud.phase==='offline'&&cloud.dirty&&cloud.ready){cloudFlush();return}await cloudAuthChanged(cloud.user)}
async function cloudBoot(){cloud.config=safeConfig();if(!cloud.config){cloudSetPhase('unconfigured','Conecte o novo projeto ACADEPOL em Configurações → Firebase. Seus dados permanecem neste navegador.');return;}cloudSetPhase('initializing','Carregando bibliotecas Firebase...');try{
 const base='https://www.gstatic.com/firebasejs/12.19.0/';
 const [app,auth,fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
 cloud.sdk={app,auth,fs};const instance=app.initializeApp(cloud.config,'academia-ip-v1');cloud.auth=auth.getAuth(instance);cloud.db=fs.getFirestore(instance);
 auth.onAuthStateChanged(cloud.auth,cloudAuthChanged,e=>cloudSetPhase('error',cloudErrorText(e)));
 }catch(e){cloudSetPhase('error','Bibliotecas do Firebase indisponíveis. O armazenamento local continua funcionando. '+cloudErrorText(e))}}

hydrateScheduleImports();applyTheme();persist();render();cloudBoot();
</script>
